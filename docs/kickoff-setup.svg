<svg xmlns="http://www.w3.org/2000/svg" width="1876" height="3328" viewBox="0 0 1876 3328" font-family="'DejaVu Sans Mono', 'Menlo', 'Consolas', 'Liberation Mono', 'Courier New', monospace" font-size="14px">
  <title>Kickoff: before the lead starts</title>
  <defs>
  </defs>
  <rect x="0" y="0" width="1876" height="3328" fill="#111111"/>
  <g font-size="17px">
  <text x="897" y="57.45" fill="#d9d9d9" text-anchor="start">0. Enter</text>
  </g>
  <path d="M40 106 H1012 V150 H40 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="444" y="90.45" fill="#d9d9d9" text-anchor="start">On your own host</text>
  </g>
  <g font-size="12px">
  <text x="54" y="132.2" fill="#d9d9d9" text-anchor="start">⌨️ Open a shell on the host.</text>
  </g>
  <path d="M1108 106 H1836 V452 H1108 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="1370" y="90.45" fill="#d9d9d9" text-anchor="start">In a sandbox session</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="132.2" fill="#d9d9d9" text-anchor="start">⌨️ Once per project, on the sandbox host, create the</text>
  <text x="1122" y="148.2" fill="#d9d9d9" text-anchor="start">project:</text>
  </g>
  <path d="M1122 176 H1764 V223 H1122 Z" fill="#000000" stroke="#555555"/>
  <text x="1443" y="204.4" fill="#e8e8e8" text-anchor="middle">sandbox project create &lt;project&gt; --repo &lt;src remote&gt; --repo &lt;wiki remote&gt;</text>
  <g font-size="12px">
  <text x="1122" y="259.2" fill="#d9d9d9" text-anchor="start">⌨️ It prints one deploy key per repository: add each to its</text>
  <text x="1122" y="275.2" fill="#d9d9d9" text-anchor="start">repository on the forge, as a deploy key (on GitHub: the</text>
  <text x="1122" y="291.2" fill="#d9d9d9" text-anchor="start">repository's Settings, Deploy keys).</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="331.2" fill="#d9d9d9" text-anchor="start">⌨️ Each time you start work, on the sandbox host, start a</text>
  <text x="1122" y="347.2" fill="#d9d9d9" text-anchor="start">session. It opens tmux in the session's workspace, which is</text>
  <text x="1122" y="363.2" fill="#d9d9d9" text-anchor="start">&lt;root&gt; for every step below:</text>
  </g>
  <path d="M1122 391 H1478 V438 H1122 Z" fill="#000000" stroke="#555555"/>
  <text x="1300" y="419.4" fill="#e8e8e8" text-anchor="middle">sandbox start -p &lt;project&gt; -s &lt;session&gt;</text>
  <g font-size="17px">
  <text x="785" y="517.45" fill="#d9d9d9" text-anchor="start">1. Pi, its packages, git, tmux</text>
  </g>
  <path d="M40 566 H1012 V697 H40 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="444" y="550.45" fill="#d9d9d9" text-anchor="start">On your own host</text>
  </g>
  <g font-size="12px">
  <text x="54" y="592.2" fill="#d9d9d9" text-anchor="start">⌨️ Install them; on FreeBSD, the sandbox project's</text>
  <text x="54" y="608.2" fill="#d9d9d9" text-anchor="start">docs/install-pi.md lists every step. Pi's subagents:</text>
  </g>
  <path d="M54 636 H309 V683 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="181.5" y="664.4" fill="#e8e8e8" text-anchor="middle">pi install npm:pi-subagents</text>
  <path d="M1108 566 H1836 V610 H1108 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="1370" y="550.45" fill="#d9d9d9" text-anchor="start">In a sandbox session</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="592.2" fill="#d9d9d9" text-anchor="start">⚙️ Done by the agents template and sandbox start.</text>
  </g>
  <g font-size="17px">
  <text x="805" y="762.45" fill="#d9d9d9" text-anchor="start">2. Logins and the reviewer</text>
  </g>
  <path d="M40 811 H1012 V1124 H40 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="444" y="795.45" fill="#d9d9d9" text-anchor="start">On your own host</text>
  </g>
  <g font-size="12px">
  <text x="54" y="837.2" fill="#d9d9d9" text-anchor="start">⌨️ Claude's login for pi. For reviews, the Codex CLI logged</text>
  <text x="54" y="853.2" fill="#d9d9d9" text-anchor="start">in, or OPENAI_API_KEY set:</text>
  </g>
  <path d="M54 881 H175 V928 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="114.5" y="909.4" fill="#e8e8e8" text-anchor="middle">codex login</text>
  <g font-size="12px">
  <text x="54" y="964.2" fill="#d9d9d9" text-anchor="start">⌨️ Check one of them:</text>
  </g>
  <path d="M54 992 H234 V1039 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="144" y="1020.4" fill="#e8e8e8" text-anchor="middle">codex login status</text>
  <path d="M54 1063 H250 V1110 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="152" y="1091.4" fill="#e8e8e8" text-anchor="middle">echo $OPENAI_API_KEY</text>
  <path d="M1108 811 H1836 V1323 H1108 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="1370" y="795.45" fill="#d9d9d9" text-anchor="start">In a sandbox session</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="837.2" fill="#d9d9d9" text-anchor="start">⌨️ On the host, if there is no token in</text>
  <text x="1122" y="853.2" fill="#d9d9d9" text-anchor="start">/agents/users/&lt;user&gt;/credentials/env or if it's stale,</text>
  <text x="1122" y="869.2" fill="#d9d9d9" text-anchor="start">generate a fresh one by running:</text>
  </g>
  <path d="M1122 897 H1302 V944 H1122 Z" fill="#000000" stroke="#555555"/>
  <text x="1212" y="925.4" fill="#e8e8e8" text-anchor="middle">claude setup-token</text>
  <g font-size="12px">
  <text x="1122" y="980.2" fill="#d9d9d9" text-anchor="start">⌨️ Put the token in /agents/users/&lt;user&gt;/credentials/env:</text>
  </g>
  <path d="M1122 1008 H1520 V1055 H1122 Z" fill="#000000" stroke="#555555"/>
  <text x="1321" y="1036.4" fill="#e8e8e8" text-anchor="middle">CLAUDE_CODE_OAUTH_TOKEN=&lt;claude_oauth_token&gt;</text>
  <g font-size="12px">
  <text x="1122" y="1091.2" fill="#d9d9d9" text-anchor="start">⌨️ In the sandbox, log the Codex CLI in to your ChatGPT</text>
  <text x="1122" y="1107.2" fill="#d9d9d9" text-anchor="start">account, for reviews:</text>
  </g>
  <path d="M1122 1135 H1360 V1182 H1122 Z" fill="#000000" stroke="#555555"/>
  <text x="1241" y="1163.4" fill="#e8e8e8" text-anchor="middle">codex login --device-auth</text>
  <g font-size="12px">
  <text x="1122" y="1218.2" fill="#d9d9d9" text-anchor="start">⌨️ Log pi in to the same account, for its GPT models and web</text>
  <text x="1122" y="1234.2" fill="#d9d9d9" text-anchor="start">search: inside pi, type this, then choose openai-codex:</text>
  </g>
  <path d="M1122 1262 H1201 V1309 H1122 Z" fill="#000000" stroke="#555555"/>
  <text x="1161.5" y="1290.4" fill="#e8e8e8" text-anchor="middle">/login</text>
  <g font-size="17px">
  <text x="892" y="1388.45" fill="#d9d9d9" text-anchor="start">3. Skills</text>
  </g>
  <path d="M40 1437 H1012 V1840 H40 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="444" y="1421.45" fill="#d9d9d9" text-anchor="start">On your own host</text>
  </g>
  <g font-size="12px">
  <text x="54" y="1463.2" fill="#d9d9d9" text-anchor="start">⌨️ Install them:</text>
  </g>
  <path d="M54 1491 H998 V1557 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="68" y="1519.4" fill="#e8e8e8" text-anchor="start">npx -y skills@latest add mattpocock/skills -g -a pi -y --skill chief-of-staff grill-with-docs \</text>
  <text x="68" y="1538.4" fill="#e8e8e8" text-anchor="start">grilling to-spec to-tickets implement implement-spec code-review tdd retro writing-for-agents domain-modeling</text>
  <path d="M54 1581 H822 V1628 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="438" y="1609.4" fill="#e8e8e8" text-anchor="middle">npx -y skills@latest add matias-pizarro/agentic_workflow -g -a pi -y --skill review-loop</text>
  <path d="M54 1652 H670 V1699 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="362" y="1680.4" fill="#e8e8e8" text-anchor="middle">npx -y skills@latest add humanlayer/skills -g -a pi -y --skill show-me</text>
  <g font-size="12px">
  <text x="54" y="1735.2" fill="#d9d9d9" text-anchor="start">⌨️ Check review-loop is v1.0.0 or later; this prints a</text>
  <text x="54" y="1751.2" fill="#d9d9d9" text-anchor="start">number above 0:</text>
  </g>
  <path d="M54 1779 H511 V1826 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="282.5" y="1807.4" fill="#e8e8e8" text-anchor="middle">grep -c DRIFT ~/.agents/skills/review-loop/SKILL.md</text>
  <path d="M1108 1437 H1836 V1497 H1108 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="1370" y="1421.45" fill="#d9d9d9" text-anchor="start">In a sandbox session</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="1463.2" fill="#d9d9d9" text-anchor="start">⚙️ Nothing to do: the first sandbox start installs the</text>
  <text x="1122" y="1479.2" fill="#d9d9d9" text-anchor="start">skills listed in src's skills-lock.json.</text>
  </g>
  <g font-size="17px">
  <text x="851" y="1905.45" fill="#d9d9d9" text-anchor="start">4. Lay out &lt;root&gt;</text>
  </g>
  <path d="M40 1954 H1012 V2465 H40 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="444" y="1938.45" fill="#d9d9d9" text-anchor="start">On your own host</text>
  </g>
  <g font-size="12px">
  <text x="54" y="1980.2" fill="#d9d9d9" text-anchor="start">⌨️ By hand, in &lt;root&gt;, with src cloned or made there:</text>
  </g>
  <path d="M54 2008 H763 V2055 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="408.5" y="2036.4" fill="#e8e8e8" text-anchor="middle">git clone --branch v2.23.0 https://github.com/matias-pizarro/agentic_workflow.git</text>
  <path d="M54 2079 H250 V2126 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="152" y="2107.4" fill="#e8e8e8" text-anchor="middle">mkdir worktrees html</text>
  <path d="M54 2150 H192 V2197 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="123" y="2178.4" fill="#e8e8e8" text-anchor="middle">git init wiki</text>
  <g font-size="12px">
  <text x="54" y="2233.2" fill="#d9d9d9" text-anchor="start">⌨️ The wiki's commit guard, refusing a file emptied by</text>
  <text x="54" y="2249.2" fill="#d9d9d9" text-anchor="start">accident:</text>
  </g>
  <path d="M54 2277 H754 V2324 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="404" y="2305.4" fill="#e8e8e8" text-anchor="middle">ln -s ../../../agentic_workflow/tools/wiki-pre-commit wiki/.git/hooks/pre-commit</text>
  <g font-size="12px">
  <text x="54" y="2360.2" fill="#d9d9d9" text-anchor="start">⌨️ A later release, once its CHANGELOG.md section says what</text>
  <text x="54" y="2376.2" fill="#d9d9d9" text-anchor="start">it asks:</text>
  </g>
  <path d="M54 2404 H402 V2451 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="228" y="2432.4" fill="#e8e8e8" text-anchor="middle">git -C agentic_workflow checkout &lt;tag&gt;</text>
  <path d="M1108 1954 H1836 V2117 H1108 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="1370" y="1938.45" fill="#d9d9d9" text-anchor="start">In a sandbox session</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="1980.2" fill="#d9d9d9" text-anchor="start">⌨️ In the session's tmux, run this once, with your project's</text>
  <text x="1122" y="1996.2" fill="#d9d9d9" text-anchor="start">two repository addresses. It clones src, the wiki and</text>
  <text x="1122" y="2012.2" fill="#d9d9d9" text-anchor="start">agentic_workflow into &lt;root&gt;, makes worktrees/ and html/,</text>
  <text x="1122" y="2028.2" fill="#d9d9d9" text-anchor="start">and installs both commit guards, so steps 4 and 6 are done:</text>
  </g>
  <path d="M1122 2056 H1822 V2103 H1122 Z" fill="#000000" stroke="#555555"/>
  <text x="1472" y="2084.4" fill="#e8e8e8" text-anchor="middle">/sandbox/agent-defaults/src/scripts/sandbox-team-root &lt;src remote&gt; &lt;wiki remote&gt;</text>
  <g font-size="17px">
  <text x="841" y="2530.45" fill="#d9d9d9" text-anchor="start">5. src's agent docs</text>
  </g>
  <path d="M40 2579 H1012 V2639 H40 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="444" y="2563.45" fill="#d9d9d9" text-anchor="start">On your own host</text>
  </g>
  <g font-size="12px">
  <text x="54" y="2605.2" fill="#d9d9d9" text-anchor="start">⌨️ Write them (kickoff.md lists them), or have a seat draft</text>
  <text x="54" y="2621.2" fill="#d9d9d9" text-anchor="start">them once the lead runs.</text>
  </g>
  <path d="M1108 2579 H1836 V2623 H1108 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="1370" y="2563.45" fill="#d9d9d9" text-anchor="start">In a sandbox session</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="2605.2" fill="#d9d9d9" text-anchor="start">⌨️ The same.</text>
  </g>
  <g font-size="17px">
  <text x="764.5" y="2704.45" fill="#d9d9d9" text-anchor="start">6. The guards and prompt templates</text>
  </g>
  <path d="M40 2753 H1012 V3098 H40 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="444" y="2737.45" fill="#d9d9d9" text-anchor="start">On your own host</text>
  </g>
  <g font-size="12px">
  <text x="54" y="2779.2" fill="#d9d9d9" text-anchor="start">⌨️ The lead's commit guard; with no hooks from the</text>
  <text x="54" y="2795.2" fill="#d9d9d9" text-anchor="start">pre-commit tool, copy it instead, executable, and drop its</text>
  <text x="54" y="2811.2" fill="#d9d9d9" text-anchor="start">last line:</text>
  </g>
  <path d="M54 2839 H796 V2886 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="425" y="2867.4" fill="#e8e8e8" text-anchor="middle">ln -s ../../../agentic_workflow/tools/src-pre-commit &lt;root&gt;/src/.git/hooks/pre-commit</text>
  <g font-size="12px">
  <text x="54" y="2922.2" fill="#d9d9d9" text-anchor="start">⌨️ The agents' guards and prompt templates; rerun the second</text>
  <text x="54" y="2938.2" fill="#d9d9d9" text-anchor="start">after each new release:</text>
  </g>
  <path d="M54 2966 H654 V3013 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="354" y="2994.4" fill="#e8e8e8" text-anchor="middle">cp -n ~/.pi/agent/settings.json ~/.pi/agent/settings.json.bak-guards</text>
  <path d="M54 3037 H561 V3084 H54 Z" fill="#000000" stroke="#555555"/>
  <text x="307.5" y="3065.4" fill="#e8e8e8" text-anchor="middle">node &lt;root&gt;/agentic_workflow/tools/extensions/install.mjs</text>
  <path d="M1108 2753 H1836 V2829 H1108 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="1370" y="2737.45" fill="#d9d9d9" text-anchor="start">In a sandbox session</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="2779.2" fill="#d9d9d9" text-anchor="start">⚙️ The commit guards: done in step 4. The agents' guards and</text>
  <text x="1122" y="2795.2" fill="#d9d9d9" text-anchor="start">templates: done at every sandbox start, at the release</text>
  <text x="1122" y="2811.2" fill="#d9d9d9" text-anchor="start">lib/agentic_workflow.sh names.</text>
  </g>
  <g font-size="17px">
  <text x="795" y="3163.45" fill="#d9d9d9" text-anchor="start">7. An expendable environment</text>
  </g>
  <path d="M40 3212 H1012 V3288 H40 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="444" y="3196.45" fill="#d9d9d9" text-anchor="start">On your own host</text>
  </g>
  <g font-size="12px">
  <text x="54" y="3238.2" fill="#d9d9d9" text-anchor="start">⌨️ Have one ready (a disposable container or jail, a test</text>
  <text x="54" y="3254.2" fill="#d9d9d9" text-anchor="start">VM, a cloud sandbox) and a spending cap you are comfortable</text>
  <text x="54" y="3270.2" fill="#d9d9d9" text-anchor="start">with. The first ticket runs there.</text>
  </g>
  <path d="M1108 3212 H1836 V3272 H1108 Z" fill="#142814" stroke="#486544"/>
  <g font-size="17px">
  <text x="1370" y="3196.45" fill="#d9d9d9" text-anchor="start">In a sandbox session</text>
  </g>
  <g font-size="12px">
  <text x="1122" y="3238.2" fill="#d9d9d9" text-anchor="start">⌨️ The same; seats test in a child jail or a cloud sandbox,</text>
  <text x="1122" y="3254.2" fill="#d9d9d9" text-anchor="start">not in the session itself.</text>
  </g>
</svg>
